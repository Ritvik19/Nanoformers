env_path: ".env"
model_path: "distilbert/distilbert-base-uncased"
dataset_path: "Ritvik19/dair-ai-emotion"
output_dir: "models/seqclf_distilbert_dair-ai-emotion_lora"

# WandB settings
wandb_project: "nanoformers"
wandb_run_name: "seqclf_distilbert_dair-ai-emotion_lora"

# Training settings
batch_size: 128
gradient_accumulation_steps: 1
num_epochs: 3
learning_rate: 2e-5
lr_scheduler_type: "cosine"
max_length: 512
device: "cuda"

# LoRA / QLoRA settings
peft:
  use_lora: true
  use_qlora: false
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules: null      # auto-inferred for DistilBERT: [q_lin, k_lin, v_lin] or [query, key, value]
  modules_to_save: ["classifier"]  # keep classification head trainable
  save_mode: "adapter"
