env_path: ".env"
model_path: "distilbert/distilbert-base-uncased"
dataset_path: "Ritvik19/conll-2003-ner"
output_dir: "models/tokclf_distilbert_conll2003_lora"

# Dataset settings
label_all_tokens: false

# WandB settings
wandb_project: "nanoformers"
wandb_run_name: "tokclf_distilbert_conll2003_lora"

# Training settings
batch_size: 128
gradient_accumulation_steps: 1
num_epochs: 3
learning_rate: 2e-5
lr_scheduler_type: "cosine"
max_length: 256
device: "cuda"

# LoRA / QLoRA settings
peft:
  use_lora: true
  use_qlora: false
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules: null
  modules_to_save: ["classifier"]  # keep token classification head trainable
  save_mode: "adapter"
