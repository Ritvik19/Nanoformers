env_path: ".env"
model_path: "bert-base-uncased"
dataset_path: "Ritvik19/open-web-text"
output_dir: "models/mlm_bert_open_web_text_lora"

# WandB settings
wandb_project: "nanoformers"
wandb_run_name: "mlm_bert_open_web_text_lora"

# Training settings
batch_size: 64
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 5e-5
lr_scheduler_type: "linear"
max_length: 128
mlm_probability: 0.15
device: "cuda"
load_weights: true

# LoRA / QLoRA settings
peft:
  use_lora: false
  use_qlora: true
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules: null      # auto-inferred for BERT: [query, key, value]
  modules_to_save: ["cls"]  # keep the MLM head trainable
  save_mode: "adapter"
