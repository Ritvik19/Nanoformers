env_path: ".env"
model_path: "distilbert/distilbert-base-uncased"
dataset_path: "Ritvik19/squad-v2"
output_dir: "models/qa_distilbert_squad_lora"

# WandB settings
wandb_project: "nanoformers"
wandb_run_name: "qa_distilbert_squad_lora"

# Training settings
batch_size: 16
gradient_accumulation_steps: 1
num_epochs: 10
learning_rate: 3e-5
lr_scheduler_type: "cosine"
max_length: 384
device: "cuda"

# LoRA / QLoRA settings
peft:
  use_lora: true
  use_qlora: false
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules: null
  modules_to_save: ["qa_outputs"]  # keep QA span head trainable
  save_mode: "adapter"
