env_path: ".env"
model_path: "Qwen/Qwen3-0.6B"
dataset_path: "Ritvik19/math-rl"
output_dir: "models/gspo_qwen_math_lora"

# WandB settings
wandb_project: "nanoformers"
wandb_run_name: "gspo_qwen_math_lora"

# Training settings
batch_size: 1
gradient_accumulation_steps: 128
num_epochs: 2
learning_rate: 1e-6
lr_scheduler_type: "cosine"
max_length: 2560
device: "cuda"

# GSPO settings
group_size: 4
importance_ratio_level: "sequence"
clip_low: 3e-4
clip_high: 3e-4
std_normalize: true
num_grpo_epochs: 1
target_kl: null
kl_coeff: 0.0

# Generation settings (vLLM rollouts)
max_new_tokens: 2048
temperature: 1.0
top_p: 1.0
top_k: -1

# vLLM client settings
# Start vLLM with: ENABLE_LORA=1 bash scripts/serve_vllm.sh
vllm_base_url: "http://localhost:8000/v1"
vllm_admin_url: "http://localhost:8000"
vllm_api_key: "EMPTY"
vllm_served_model_name: "Qwen/Qwen3-0.6B"
vllm_sync_every_rollouts: 1

# LoRA / QLoRA settings
peft:
  use_lora: true
  use_qlora: false
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules: null
  modules_to_save: null
  save_mode: "adapter"
  use_disable_adapter_as_ref: true
  vllm_lora_name: "gspo_lora"
