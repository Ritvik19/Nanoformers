env_path: ".env"
model_path: "Qwen/Qwen3-0.6B"
dataset_path: "Ritvik19/math-rl"
output_dir: "models/reinforce_qwen_math"

# WandB settings
wandb_project: "nanoformers"
wandb_run_name: "reinforce_qwen_math"

# Training settings
batch_size: 4
gradient_accumulation_steps: 32
num_epochs: 2
learning_rate: 1e-6
lr_scheduler_type: "cosine"
max_length: 2560
device: "cuda"

# REINFORCE settings
use_baseline: true
length_normalize: true
kl_coeff: 0.0

# Generation settings (vLLM rollouts)
max_new_tokens: 2048
temperature: 1.0
top_p: 1.0
top_k: -1

# vLLM client settings
vllm_base_url: "http://localhost:8000/v1"
vllm_admin_url: "http://localhost:8000"
vllm_api_key: "EMPTY"
vllm_served_model_name: "Qwen/Qwen3-0.6B"
vllm_sync_every_steps: 1           # push policy weights to vLLM every N optimizer steps (1 = every step, 0 = epoch-only)
