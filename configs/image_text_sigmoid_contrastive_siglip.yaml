env_path: ".env"
text_model_path: "distilbert/distilbert-base-uncased"
image_model_path: "google/vit-base-patch16-224"
projection_dim: 512
dataset_path: "<your-hf-dataset>"  # columns: image (PIL Image), text (str)
output_dir: "models/image_text_sigmoid_contrastive_siglip"

# WandB settings
wandb_project: "nanoformers"
wandb_run_name: "image_text_sigmoid_contrastive_siglip"

# Training settings
batch_size: 64
gradient_accumulation_steps: 1
num_epochs: 3
learning_rate: 5e-6
lr_scheduler_type: "cosine"
max_length: 64
device: "cuda"
